[project]
name = "sync-helper"
version = "0.1.1"
requires-python = ">=3.14"
dependencies = [
    "b2sdk>=2.12.0",
    "click>=8.5.0",
    "click-loguru>=1.3.8",
    "parse>=1.22.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
]
#[tool.setuptools]
#package-dir = { "" = "src" }
[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]
[tool.uv]
package = true

[project.scripts]
sync-helper = "sync_helper.sync_images:cli"
